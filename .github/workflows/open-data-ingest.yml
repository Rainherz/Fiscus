name: Fiscus open-data ingest

# MEF open data, two files on fs.datosabiertos.mef.gob.pe (reachable from GitHub-hosted runners,
# unlike the SSI host):
#   DETALLE_INVERSIONES.csv (~250 MB): every active investment of national, regional and local governments.
#   CIERRE_INVERSIONES.csv  (~120 MB): every closed investment of those levels.
# Neither file is refreshed daily: each ingest compares Last-Modified and Content-Length with its own
# public.source_snapshots row and exits without downloading when unchanged.
#
# Daily at 10:00 UTC = 05:00 Lima, after the 04:00 SSI run on the machine in Peru.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ingest even if the files are unchanged since the last ingest"
        type: boolean
        required: false
        default: false

concurrency:
  group: fiscus-open-data-ingest
  cancel-in-progress: false

permissions:
  contents: read
  # Only for the failure alert below (an ingest-failure issue).
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: tests
        run: pnpm --filter @fiscus/ingest test

      - name: Ingest MEF open data into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: pnpm ingest:open-data $FORCE

      # Runs even when the active ingest failed (the files are independent), but not when the tests did.
      - name: Ingest MEF closed investments into Supabase
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: pnpm ingest:open-data-closed $FORCE

      # Opens an ingest-failure issue, or comments on the open one with the same title, so repeated
      # failures stay in one thread. Covers both ingests (failure() is true when either step failed).
      # Freshness (a run that never happens) is data-freshness.yml.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Falló la ingesta de datos abiertos"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="La ingesta de datos abiertos (inversiones activas o cerradas) falló (${{ github.event_name }}). Ejecución: $RUN_URL"
          gh label create ingest-failure --color B60205 --description "Falla de una ingesta" --force
          number=$(gh issue list --state open --label ingest-failure --search "in:title \"$TITLE\"" \
            --json number,title --jq "map(select(.title == \"$TITLE\")) | first | .number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --label ingest-failure --body "$body"
          fi
