name: Fiscus CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Typechecks and tests every workspace package (packages/ingest, apps/mobile).
      - run: pnpm typecheck

      - run: pnpm test

      - name: Mobile web build
        run: pnpm --filter @fiscus/mobile exec expo export --platform web --output-dir dist
        env:
          CI: "1"
          EXPO_PUBLIC_USE_MOCK: "1"
